# 수집 워크플로. 거래소를 새로 추가할 때만 아래 env에 키 이름을 더함
name: sync-trades

on:
  schedule:
    # 1시간마다 (매시 7분, 정각 몰림 피함)
    - cron: "7 * * * *"
  workflow_dispatch: {}   # 사이트의 [동기화] 버튼과 거래소 연결 확인이 이걸 호출

permissions:
  contents: write

concurrency:
  group: sync-trades
  cancel-in-progress: false

jobs:
  sync:
    # 거래소가 GitHub 서버(미국)를 막으면 self-hosted 로 바꾸면 됨 (README 참고)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 거래소 체결내역 수집
        env:
          # 필요한 키만 하나씩 전달 (공개 저장소에서 Secrets 전체를 넘기면 GitHub이 위험한 워크플로로 막음)
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
        run: python3 scripts/sync.py

      - name: 변경분 커밋
        run: |
          git config user.name "trade-journal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "sync: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 3
          done
          exit 1
